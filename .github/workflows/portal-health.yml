name: Portal health check

# Talks to the real microdata.gov.in every Monday, so a change in the portal's API shows up here
# before it reaches users. Needs a repository secret MOSPI_API_KEY; skipped without one.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Live API tests
        env:
          MOSPI_API_KEY: ${{ secrets.MOSPI_API_KEY }}
        run: |
          if [ -z "$MOSPI_API_KEY" ]; then echo "No MOSPI_API_KEY secret; skipping."; exit 0; fi
          pytest -m live -o addopts="" -v
