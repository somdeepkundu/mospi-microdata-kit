[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mospi-microdata-kit"
dynamic = ["version"]
description = "Download, read and analyse unit-level survey data from India's microdata.gov.in (MoSPI), with survey-weighted estimates and error margins."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Somdeep Kundu", email = "somdeepkundu@gmail.com" }]
keywords = ["MoSPI", "NSS", "NSSO", "microdata", "India", "survey", "PLFS", "agriculture", "official statistics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.28",
  "pandas>=1.5",
  "numpy>=1.23",
]

[project.optional-dependencies]
progress = ["tqdm>=4.64"]
spss = ["pyreadstat>=1.2"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "responses>=0.24",
  "ruff>=0.6",
  "mypy>=1.8",
  "pandas-stubs",
  "types-requests",
  "nbformat>=5.9",
  "nbclient>=0.9",
  "ipykernel>=6.25",
]

[project.scripts]
mospi-kit = "mospi_kit.cli:main"

[project.urls]
Homepage = "https://somdeepkundu.github.io/farm-income/"
Source = "https://github.com/somdeepkundu/mospi-microdata-kit"
Issues = "https://github.com/somdeepkundu/mospi-microdata-kit/issues"
Changelog = "https://github.com/somdeepkundu/mospi-microdata-kit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mospi_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mospi_kit"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: talks to microdata.gov.in (needs MOSPI_API_KEY); skipped by default"]

[tool.coverage.run]
source = ["mospi_kit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Colab only recognises form fields written as "#@param"; the formatter would add a space
exclude = ["notebooks/*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = [
  "PLR0913",  # survey functions take several design arguments by name
  "PLR2004",  # thresholds are named in the docs next to where they are used
  "S101",     # asserts are fine in tests
  "PLR0912", "PLR0915",
  "PLC0415",  # optional dependencies (tqdm, scipy, pyreadstat) are imported where used
  "RUF001", "RUF002", "RUF003",  # en dashes, minus and × signs in user-facing text are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR", "B"]
# Colab form fields (#@param) come first in a cell, so imports follow them
"notebooks/*" = ["E402", "E501", "I001", "S603", "PLW1510", "BLE001"]
"src/mospi_kit/client.py" = ["S501"]  # verify=False is an explicit, logged, opt-in fallback

[tool.mypy]
strict = true
warn_unreachable = true
ignore_missing_imports = true
files = ["src/mospi_kit"]
